name: Deploy save worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Deploy worker and publish save URL
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          GITHUB_OWNER: hsy7yf7457-sketch
          GITHUB_REPO: wooden-labyrinth-editor
          GITHUB_BRANCH: main
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
        run: |
          npm ci || npm install
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          node scripts/publish-url.mjs < /tmp/deploy.log
          if [ -n "$WORKER_GITHUB_TOKEN" ]; then
            echo "$WORKER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          fi
