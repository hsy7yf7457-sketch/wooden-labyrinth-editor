name: Deploy editor to hammer-golf.com

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "editor.js"
      - "editor.css"
      - "save-api.json"
      - "assets/**"
      - "packs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hsy7yf7457-sketch/hammer-golf-site
          token: ${{ secrets.HAMMER_GOLF_DEPLOY_TOKEN }}
          path: site

      - name: Sync editor files
        run: |
          rm -rf site/editor
          mkdir -p site/editor
          rsync -a \
            index.html editor.js editor.css save-api.json assets packs \
            site/editor/

      - name: Push to hammer-golf-site
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Update level editor from wooden-labyrinth-editor"
          git push
